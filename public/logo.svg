<?xml version="1.0" encoding="UTF-8"?>
<!-- Topo do Rift — marca Hextech: coroa dourada no anel hexagonal -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1428"/>
      <stop offset="1" stop-color="#101D32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E6D2"/>
      <stop offset="0.45" stop-color="#C8AA6E"/>
      <stop offset="1" stop-color="#785A28"/>
    </linearGradient>
  </defs>

  <!-- fundo com cantos arredondados -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- anel hexagonal duplo -->
  <polygon points="256,59 426.6,157.5 426.6,354.5 256,453 85.4,354.5 85.4,157.5"
           fill="none" stroke="#785A28" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="256,59 426.6,157.5 426.6,354.5 256,453 85.4,354.5 85.4,157.5"
           fill="none" stroke="#C8AA6E" stroke-width="6.5" stroke-linejoin="round"/>
  <polygon points="256,79 409.3,167.5 409.3,344.5 256,433 102.7,344.5 102.7,167.5"
           fill="none" stroke="#785A28" stroke-width="3" stroke-linejoin="round"/>

  <!-- coroa -->
  <polygon points="169,311.5 169,215.5 204,246 224.7,203.6 256,188.5 287.3,203.6 308,246 343,215.5 343,311.5"
           fill="url(#gold)" stroke="#785A28" stroke-width="3" stroke-linejoin="round"/>
  <!-- joias das pontas -->
  <circle cx="169" cy="215.5" r="10.8" fill="#F0E6D2" stroke="#785A28" stroke-width="2"/>
  <circle cx="256" cy="185" r="10.8" fill="#F0E6D2" stroke="#785A28" stroke-width="2"/>
  <circle cx="343" cy="215.5" r="10.8" fill="#F0E6D2" stroke="#785A28" stroke-width="2"/>
  <!-- gema teal -->
  <polygon points="256,246.9 267.5,262.3 256,277.7 244.5,262.3" fill="#0AC8B9" stroke="#066E64" stroke-width="1.5"/>
  <!-- base da coroa -->
  <rect x="162.8" y="311.5" width="186.4" height="15.4" rx="7.7" fill="#C8AA6E" stroke="#785A28" stroke-width="2"/>
</svg>
